name: Mobile Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  # Roda em todo push: valida que o código importa/coleta e que o Appium sobe.
  # É o que o badge reflete — rápido e confiável (não depende de emulador).
  validate:
    name: Validação (código + Appium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Appium + driver
        run: |
          npm install -g appium
          appium driver install uiautomator2
      - name: Appium sobe e os testes coletam sem erro
        run: |
          appium --log appium.log &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:4723/status && break; sleep 2; done
          curl -sf http://127.0.0.1:4723/status
          pytest --collect-only -q

  # Best-effort: executa a suíte num emulador Android real.
  # Só roda sob demanda (workflow_dispatch) porque o emulador no runner grátis
  # do GitHub é lento/instável; é falha permitida e tem timeout.
  emulator:
    name: E2E no emulador Android (best-effort, sob demanda)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install -g appium
          appium driver install uiautomator2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: Nexus 6
          disable-animations: true
          script: |
            adb wait-for-device
            appium --log appium.log &
            for i in $(seq 1 30); do curl -sf http://127.0.0.1:4723/status && break; sleep 2; done
            pytest --reruns 2 --reruns-delay 5
